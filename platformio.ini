; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env]
platform = espressif32 @ 6.12.0
framework = espidf
monitor_speed = 115200
board = esp32-s3-devkitm-1
lib_extra_dirs = components
build_flags = 
  ; Enables many recommended warnings at once
  ; https://gcc.gnu.org/onlinedocs/gcc/Warning-Options.html
  -Wall
lib_ldf_mode = chain
ccache = yes

[env:main]

[env:mobo_physical]
; Physical car build — reads real GPIO pins, no virtual state

[env:mobo_virtual]
; QEMU/SIL build — injects VIRTUAL_ENV so all GPIO reads go through the HAL
build_flags =
    -Wall
    -D VIRTUAL_ENV

[env:debug]
build_type = debug
debug_tool = esp-builtin
debug_speed = 10000
debug_init_break = tbreak app_main
monitor_filters = reset
debug_extra_cmds =
  set remotetimeout 2ull